name: practica2
description: "practica2"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  # Ресурсы приложения: изображения
  assets:
    - assets/images/

  # Кастомные шрифты
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans.ttf